name: Build Terravale APK

on:
  workflow_dispatch:
  push:
    paths:
      - terravale.zip
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip the game
        run: |
          unzip -q terravale.zip -d _game
          mkdir -p www/vendor
          cp -r _game/terravale/. www/
          curl -fsSL -o www/vendor/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          test -s www/vendor/three.min.js
          test -s www/index.html

      - name: Create the Android app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Terravale com.terravale.game --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Terravale.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Terravale-apk
          path: Terravale.apk

      - name: Publish the APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Terravale.apk \
            --title "Terravale build ${{ github.run_number }}" \
            --notes "Debug APK. Download Terravale.apk on your phone and install it."
